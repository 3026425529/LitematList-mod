name: Build LitematList 26.3

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build-26.3.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Download Gradle 9.6.0
        run: |
          curl -fL https://services.gradle.org/distributions/gradle-9.6.0-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-9.6.0/bin" >> "$GITHUB_PATH"
          gradle --version

      - name: Extract source archive
        shell: bash
        run: |
          set -euo pipefail
          archive=$(find . -maxdepth 1 -type f -name 'litematlist-1.3.1-26.3.zip' | head -n1)
          test -n "$archive"
          rm -rf project
          mkdir project
          unzip -q "$archive" -d project
          test -f project/build.gradle
          test -f project/src/main/resources/fabric.mod.json

      - name: Patch 26.3 API changes
        working-directory: project
        shell: python
        run: |
          from pathlib import Path

          root = Path("src/main/java")

          # 26.2+: screen management moved from Minecraft to Gui.
          replacements = 0
          for p in root.rglob("*.java"):
              s = p.read_text(encoding="utf-8")
              ns = s.replace("Minecraft.getInstance().setScreen(", "Minecraft.getInstance().gui.setScreen(")
              ns = ns.replace("client.setScreen(", "client.gui.setScreen(")
              if ns != s:
                  replacements += 1
                  p.write_text(ns, encoding="utf-8")

          # 26.3 moved GPU texture interfaces out of com.mojang.blaze3d.textures.
          # Use inferred generic types so the code follows the actual API types.
          for name in ["TxtBrowserScreen.java", "MaterialListScreen.java", "MaterialDetailScreen.java"]:
              p = root / "com" / "litematlist" / "gui" / name
              s = p.read_text(encoding="utf-8")
              s = s.replace("import com.mojang.blaze3d.textures.GpuTextureView;\\n", "")
              s = s.replace("import com.mojang.blaze3d.textures.GpuSampler;\\n", "")
              s = s.replace("Pair<GpuTextureView, GpuSampler> pair", "var pair")
              p.write_text(s, encoding="utf-8")

          # MaLiLib 0.30.x no longer exposes JsonUtils. Use Gson directly.
          p = root / "com" / "litematlist" / "config" / "Configs.java"
          s = p.read_text(encoding="utf-8")
          s = s.replace("import java.nio.file.Files;\\n",
                        "import java.nio.file.Files;\\n"
                        "import java.nio.charset.StandardCharsets;\\n"
                        "import java.io.Reader;\\n"
                        "import java.io.Writer;\\n")
          s = s.replace("import com.google.gson.JsonObject;\\n",
                        "import com.google.gson.JsonObject;\\n"
                        "import com.google.gson.JsonParser;\\n"
                        "import com.google.gson.Gson;\\n")
          s = s.replace("import fi.dy.masa.malilib.util.JsonUtils;\\n", "")
          s = s.replace("public class Configs implements IConfigHandler\\n{\\n",
                        "public class Configs implements IConfigHandler\\n{\\n"
                        "    private static final Gson GSON = new Gson();\\n")

          old_load = """            JsonElement element = JsonUtils.parseJsonFileAsPath(configFile);

            if (element != null && element.isJsonObject())
            {
                JsonObject root = element.getAsJsonObject();
                ConfigUtils.readConfigBase(root, "Generic", Generic.OPTIONS);
                ConfigUtils.readConfigBase(root, "Hotkeys", Hotkeys.HOTKEY_LIST);
            }
"""
          new_load = """            try (Reader reader = Files.newBufferedReader(configFile, StandardCharsets.UTF_8))
            {
                JsonElement element = JsonParser.parseReader(reader);
                if (element != null && element.isJsonObject())
                {
                    JsonObject root = element.getAsJsonObject();
                    ConfigUtils.readConfigBase(root, "Generic", Generic.OPTIONS);
                    ConfigUtils.readConfigBase(root, "Hotkeys", Hotkeys.HOTKEY_LIST);
                }
            }
            catch (Exception e)
            {
                LitematListMod.LOGGER.error("读取配置失败", e);
            }
"""
          if old_load not in s:
              raise SystemExit("Expected Configs.loadFromFile block not found")
          s = s.replace(old_load, new_load, 1)
          old_save = "        JsonUtils.writeJsonToFileAsPath(root, configFile);\\n"
          new_save = """        try (Writer writer = Files.newBufferedWriter(configFile, StandardCharsets.UTF_8))
        {
            GSON.toJson(root, writer);
        }
        catch (Exception e)
        {
            LitematListMod.LOGGER.error("保存配置失败", e);
        }
"""
          if old_save not in s:
              raise SystemExit("Expected Configs.saveToFile block not found")
          s = s.replace(old_save, new_save, 1)
          p.write_text(s, encoding="utf-8")

          # Fail the build early if any known pre-26.3 symbols remain.
          bad = []
          for p in root.rglob("*.java"):
              s = p.read_text(encoding="utf-8")
              for token in [
                  "Minecraft.getInstance().setScreen(",
                  "client.setScreen(",
                  "GpuTextureView",
                  "GpuSampler",
                  "JsonUtils",
              ]:
                  if token in s:
                      bad.append(f"{p}: {token}")
          if bad:
              raise SystemExit("Unpatched symbols:\\n" + "\\n".join(bad))

          print(f"Patched {replacements} Java files for 26.3")

      - name: Build
        working-directory: project
        run: gradle --no-daemon --stacktrace build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: litematlist-26.3
          path: project/build/libs/*.jar
          if-no-files-found: error
