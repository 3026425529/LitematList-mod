name: Build LitematList 26.3

on:
  workflow_dispatch:
  push:
    paths:
      - 'source/*.zip'
      - '.github/workflows/build-26.3.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Download Gradle 9.6.0
        run: |
          curl -fL https://services.gradle.org/distributions/gradle-9.6.0-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-9.6.0/bin" >> "$GITHUB_PATH"
          gradle --version

      - name: Extract source archive
        shell: bash
        run: |
          set -euo pipefail
          archive=$(find source -maxdepth 1 -type f -name '*.zip' | head -n1)
          test -n "$archive"
          rm -rf project
          mkdir project
          unzip -q "$archive" -d project
          test -f project/build.gradle
          test -f project/src/main/resources/fabric.mod.json

      - name: Build
        working-directory: project
        run: gradle --no-daemon --stacktrace build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: litematlist-26.3
          path: project/build/libs/*.jar
          if-no-files-found: error
